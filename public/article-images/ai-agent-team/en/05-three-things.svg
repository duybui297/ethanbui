<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Helvetica Neue, Arial, sans-serif">
  <style>
    .ln{stroke:#94a3b8;stroke-width:1.6;}
    .t{fill:#1e293b;}
    .m{fill:#64748b;}
    .wt{fill:#ffffff;}
    .ahd{fill:#94a3b8;}
    @media (prefers-color-scheme:dark){
      .ln{stroke:#cbd5e1;} .t{fill:#f1f5f9;} .m{fill:#94a3b8;} .ahd{fill:#cbd5e1;}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="ahd"/>
    </marker>
  </defs>

  <text x="480" y="44" text-anchor="middle" font-size="15" font-weight="700" class="t">Three things that keep the agent on track</text>

  <g font-size="14">
    <rect x="40"  y="90" width="220" height="64" rx="8" fill="#2f9bde"/>
    <text x="150" y="129" text-anchor="middle" font-weight="700" class="wt">Clear spec</text>

    <rect x="370" y="90" width="220" height="64" rx="8" fill="#ef8b3a"/>
    <text x="480" y="129" text-anchor="middle" font-weight="700" class="wt">Roles assigned</text>

    <rect x="700" y="90" width="220" height="64" rx="8" fill="#e6398f"/>
    <text x="810" y="129" text-anchor="middle" font-weight="700" class="wt">Fixed process</text>
  </g>

  <line class="ln" x1="150" y1="154" x2="450" y2="232" marker-end="url(#ah)"/>
  <line class="ln" x1="480" y1="154" x2="480" y2="232" marker-end="url(#ah)"/>
  <line class="ln" x1="810" y1="154" x2="510" y2="232" marker-end="url(#ah)"/>

  <rect x="320" y="236" width="320" height="60" rx="8" fill="#8cbf3f"/>
  <text x="480" y="272" text-anchor="middle" font-size="15" font-weight="700" class="wt">Agent stays on track, less babysitting</text>

  <text x="480" y="338" text-anchor="middle" font-size="13" class="m">Miss one of the three: it guesses, skips steps, declares done too early</text>
</svg>
