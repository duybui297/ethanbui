<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Helvetica Neue, Arial, sans-serif">
  <style>
    .ln{stroke:#94a3b8;stroke-width:1.6;}
    .t{fill:#1e293b;}
    .m{fill:#64748b;}
    .wt{fill:#ffffff;}
    .ws{fill:#ffffff;opacity:.92;}
    .ahd{fill:#94a3b8;}
    @media (prefers-color-scheme:dark){
      .ln{stroke:#cbd5e1;} .t{fill:#f1f5f9;} .m{fill:#94a3b8;} .ahd{fill:#cbd5e1;}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="ahd"/>
    </marker>
  </defs>

  <rect x="340" y="24" width="240" height="62" rx="8" fill="#6c6cf0"/>
  <text x="460" y="52" text-anchor="middle" font-size="17" font-weight="700" class="wt">Orchestrator</text>
  <text x="460" y="72" text-anchor="middle" font-size="12.5" class="ws">main session, delegates</text>

  <line class="ln" x1="460" y1="86" x2="125" y2="186" marker-end="url(#ah)"/>
  <line class="ln" x1="460" y1="86" x2="348" y2="186" marker-end="url(#ah)"/>
  <line class="ln" x1="460" y1="86" x2="571" y2="186" marker-end="url(#ah)"/>
  <line class="ln" x1="460" y1="86" x2="794" y2="186" marker-end="url(#ah)"/>

  <g>
    <rect x="30" y="190" width="190" height="104" rx="8" fill="#2f9bde"/>
    <text x="125" y="224" text-anchor="middle" font-size="16" font-weight="700" class="wt">PM</text>
    <text x="125" y="248" text-anchor="middle" font-size="12" class="ws">grooms spec, story</text>
    <text x="125" y="266" text-anchor="middle" font-size="12" class="ws">final acceptance</text>
  </g>
  <g>
    <rect x="253" y="190" width="190" height="104" rx="8" fill="#34bfa0"/>
    <text x="348" y="224" text-anchor="middle" font-size="16" font-weight="700" class="wt">SWE</text>
    <text x="348" y="248" text-anchor="middle" font-size="12" class="ws">writes code</text>
    <text x="348" y="266" text-anchor="middle" font-size="12" class="ws">and tests</text>
  </g>
  <g>
    <rect x="476" y="190" width="190" height="104" rx="8" fill="#ef8b3a"/>
    <text x="571" y="224" text-anchor="middle" font-size="16" font-weight="700" class="wt">QA</text>
    <text x="571" y="248" text-anchor="middle" font-size="12" class="ws">checks each criterion</text>
    <text x="571" y="266" text-anchor="middle" font-size="12" class="ws">pass/fail with evidence</text>
  </g>
  <g>
    <rect x="699" y="190" width="190" height="104" rx="8" fill="#e6398f"/>
    <text x="794" y="224" text-anchor="middle" font-size="16" font-weight="700" class="wt">On-Call</text>
    <text x="794" y="248" text-anchor="middle" font-size="12" class="ws">watches CI/CD</text>
    <text x="794" y="266" text-anchor="middle" font-size="12" class="ws">fixes red pipelines</text>
  </g>

  <text x="460" y="350" text-anchor="middle" font-size="13.5" class="m">Each role owns a narrow slice. The role that writes code is separate from the one that grades it.</text>
</svg>
