<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Helvetica Neue, Arial, sans-serif">
  <style>
    .ln{stroke:#94a3b8;stroke-width:1.6;}
    .t{fill:#1e293b;}
    .m{fill:#64748b;}
    .wt{fill:#ffffff;}
    .ahd{fill:#94a3b8;}
    @media (prefers-color-scheme:dark){
      .ln{stroke:#cbd5e1;} .t{fill:#f1f5f9;} .m{fill:#94a3b8;} .ahd{fill:#cbd5e1;}
    }
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" class="ahd"/>
    </marker>
  </defs>

  <text x="500" y="44" text-anchor="middle" font-size="14.5" font-weight="700" class="t">Task status lives in the filename</text>

  <g font-family="Menlo, Consolas, monospace">
    <rect x="30"  y="80" width="200" height="58" rx="8" fill="#e9706b"/>
    <text x="130" y="115" text-anchor="middle" font-size="14" class="wt">.todo.md</text>

    <rect x="285" y="80" width="200" height="58" rx="8" fill="#2f9bde"/>
    <text x="385" y="115" text-anchor="middle" font-size="14" class="wt">.groomed.md</text>

    <rect x="540" y="80" width="200" height="58" rx="8" fill="#ef8b3a"/>
    <text x="640" y="115" text-anchor="middle" font-size="14" class="wt">.in-progress.md</text>

    <rect x="795" y="80" width="175" height="58" rx="8" fill="#8cbf3f"/>
    <text x="882" y="115" text-anchor="middle" font-size="14" class="wt">done/</text>
  </g>

  <g>
    <line class="ln" x1="230" y1="109" x2="281" y2="109" marker-end="url(#ah)"/>
    <line class="ln" x1="485" y1="109" x2="536" y2="109" marker-end="url(#ah)"/>
    <line class="ln" x1="740" y1="109" x2="791" y2="109" marker-end="url(#ah)"/>
  </g>

  <text x="500" y="172" text-anchor="middle" font-size="12.5" class="m">No external service, just files in the repo</text>
</svg>
