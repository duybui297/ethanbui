</defs><text x="540.0" y="42" text-anchor="middle" font-size="15" font-weight="700" class="t">One agent carrying everything drifts; splitting into roles keeps control</text><text x="265" y="82" text-anchor="middle" font-size="13" font-weight="700" class="failt">One agent does it all</text><rect x="150" y="100" width="230" height="64" rx="8" fill="#64748b"/><text x="265.0" y="137.0" text-anchor="middle" font-size="14" font-weight="700" class="wt">Spec + code + test + fixes</text><line class="ln" x1="265" y1="164" x2="265" y2="206" marker-end="url(#ah)"/><rect x="150" y="210" width="230" height="72" rx="8" fill="#e74c3c"/><text x="265.0" y="251.0" text-anchor="middle" font-size="14" font-weight="700" class="wt">Drifts, skips steps, calls it done</text><line x1="540" y1="80" x2="540" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/><text x="810" y="82" text-anchor="middle" font-size="13" font-weight="700" class="t">Split into roles</text><rect x="700" y="100" width="104" height="46" rx="8" fill="#2f9bde"/><text x="752.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" class="wt">PM</text><rect x="820" y="100" width="104" height="46" rx="8" fill="#34bfa0"/><text x="872.0" y="128.0" text-anchor="middle" font-size="12" font-weight="700" class="wt">SWE</text><rect x="700" y="154" width="104" height="46" rx="8" fill="#ef8b3a"/><text x="752.0" y="182.0" text-anchor="middle" font-size="12" font-weight="700" class="wt">QA</text><rect x="820" y="154" width="104" height="46" rx="8" fill="#e6398f"/><text x="872.0" y="182.0" text-anchor="middle" font-size="12" font-weight="700" class="wt">On-Call</text><line class="ln" x1="810" y1="212" x2="810" y2="236" marker-end="url(#ah)"/><rect x="700" y="240" width="240" height="64" rx="8" fill="#8cbf3f"/><text x="820.0" y="277.0" text-anchor="middle" font-size="14" font-weight="700" class="wt">One job per role, stays in control</text></svg>
