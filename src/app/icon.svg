  </style>
  <rect x="32" y="32" width="448" height="448" rx="112" class="bg"/>
  <g stroke="url(#grad)" stroke-width="20" stroke-linecap="round" opacity="0.4">
    <line x1="256" y1="256" x2="256" y2="120"/>
    <line x1="256" y1="256" x2="138" y2="324"/>
    <line x1="256" y1="256" x2="374" y2="324"/>
